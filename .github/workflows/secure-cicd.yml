jobs:
  build:
    name: 🏗️ Build Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -f Dockerfile.backend \
            -t ${{ env.BACKEND_IMAGE }}:${{ github.sha }} .

      - name: Build Frontend Image
        run: |
          docker build \
            -f Dockerfile.frontend \
            -t ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} .

      # Save images as artifacts for the next jobs
      - name: Save Docker images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }} \
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }} \
            -o quickbite-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: quickbite-images
          path: quickbite-images.tar

  scan:
    name: 🔍 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: quickbite-images

      - name: Load Docker images
        run: docker load -i quickbite-images.tar

      - name: Scan Backend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan Frontend with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  push:
    name: 📦 Push to Docker Hub
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: quickbite-images

      - name: Load Docker images
        run: docker load -i quickbite-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Deploy application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/quickbite

            git pull origin main

            export IMAGE_TAG=${{ github.sha }}

            docker compose pull backend frontend
            docker compose up -d --force-recreate --no-build backend frontend
