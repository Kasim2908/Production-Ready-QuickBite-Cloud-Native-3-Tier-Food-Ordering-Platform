name: Secure QuickBite CI/CD

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  BACKEND_IMAGE: mohammadkasim/food-app-backend
  FRONTEND_IMAGE: mohammadkasim/food-app-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ==========================================
  # 1. BUILD DOCKER IMAGES
  # ==========================================
  build:
    name: 🏗️ Build Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Backend Image
        run: |
          docker build \
            --file Dockerfile.backend \
            --tag ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            .

      - name: Build Frontend Image
        run: |
          docker build \
            --file Dockerfile.frontend \
            --tag ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            .

      - name: Save Docker images
        run: |
          docker save \
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }} \
            --output quickbite-images.tar

      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: quickbite-images
          path: quickbite-images.tar
          retention-days: 1

  # ==========================================
  # 2. SECURITY SCAN
  # ==========================================
  scan:
    name: 🔍 Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: quickbite-images

      - name: Load Docker images
        run: |
          docker load --input quickbite-images.tar

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  # ==========================================
  # 3. PUSH IMAGES TO DOCKER HUB
  # ==========================================
  push:
    name: 📦 Push to Docker Hub
    runs-on: ubuntu-latest
    needs: scan

    steps:
      - name: Download Docker images
        uses: actions/download-artifact@v4
        with:
          name: quickbite-images

      - name: Load Docker images
        run: |
          docker load --input quickbite-images.tar

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backend Image
        run: |
          docker push ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Push Frontend Image
        run: |
          docker push ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

  # ==========================================
  # 4. DEPLOY TO AWS EC2
  # ==========================================
  deploy:
    name: 🚀 Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: push

    steps:
      - name: Deploy application to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            cd ~/quickbite

            echo "Pulling latest deployment configuration..."
            git pull origin main

            echo "Setting image tag..."
            export IMAGE_TAG=${{ github.sha }}

            echo "Pulling Docker images from Docker Hub..."
            docker compose pull backend frontend

            echo "Deploying updated containers..."
            docker compose up -d --force-recreate --no-build backend frontend

            echo "Cleaning unused Docker images..."
            docker image prune -af

            echo "Deployment completed successfully!"

            echo "Running containers:"
            docker compose ps
