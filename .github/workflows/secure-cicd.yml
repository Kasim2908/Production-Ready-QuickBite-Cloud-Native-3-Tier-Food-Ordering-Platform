name: Secure QuickBite CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_IMAGE: mohammadkasim/food-app-backend
  FRONTEND_IMAGE: mohammadkasim/food-app-frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  secure-build-push-deploy:
    name: Build, Scan, Push and Deploy
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Source Code
      # ----------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

     
      # 2. Scan Repository for Secrets
      # ----------------------------------------
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 3. Set Up Docker Buildx
      # ----------------------------------------
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      
      # 4. Build Backend Image
      # ----------------------------------------
      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          load: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.BACKEND_IMAGE }}:latest

    
      # 5. Build Frontend Image
      # ----------------------------------------
      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          load: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.FRONTEND_IMAGE }}:latest

      
      # 6. Install Trivy
      # ----------------------------------------
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.2

     
      # ----------------------------------------
# Scan Backend Image with Trivy
# ----------------------------------------
- name: Scan Backend Image with Trivy
  uses: aquasecurity/trivy-action@master
  with:
    image-ref: ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
    format: table
    exit-code: "1"
    ignore-unfixed: true
    severity: HIGH,CRITICAL

# ----------------------------------------
# Scan Frontend Image with Trivy
# ----------------------------------------
- name: Scan Frontend Image with Trivy
  uses: aquasecurity/trivy-action@master
  with:
    image-ref: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
    format: table
    exit-code: "1"
    ignore-unfixed: true
    severity: HIGH,CRITICAL

     
      # 9. Log In to Docker Hub
      # ----------------------------------------
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      
      # 10. Push the Scanned Backend Image
      # ----------------------------------------
      - name: Push Backend Image
        run: |
          docker push "${BACKEND_IMAGE}:${IMAGE_TAG}"
          docker push "${BACKEND_IMAGE}:latest"

    
      # 11. Push the Scanned Frontend Image
      # ----------------------------------------
      - name: Push Frontend Image
        run: |
          docker push "${FRONTEND_IMAGE}:${IMAGE_TAG}"
          docker push "${FRONTEND_IMAGE}:latest"

    
      # 12. Deploy to AWS EC2
      # ----------------------------------------
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd ~/quickbite

            echo "Pulling latest deployment configuration..."
            git pull origin main

            echo "Setting image tag..."
            export IMAGE_TAG=${{ github.sha }}

            echo "Pulling images from Docker Hub..."
            docker compose pull backend frontend

            echo "Deploying application..."
            docker compose up -d --no-build backend frontend

            echo "Removing unused images..."
            docker image prune -f

            echo "Deployment status:"
            docker compose ps
