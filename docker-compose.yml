version: '3.8'

services:
  mongodb:
    image: mongo:7.0 #mongo:7.8
    container_name: quickbite_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
     - quickbite_net
## --------------------Backend-------------------- ##

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: quickbite_backend
    ports:
      - "5001:5001"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/foodiehub
      - PORT=5001
    depends_on:
      mongodb:
        condition: service_healthy
    command: npm start
    networks:
      - quickbite_net
## --------------------Frontend---------------------------- ##
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: quickbite_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quickbite_net
## --------------------Prometheus-------------------- ##
  prometheus:
    image: prom/prometheus:latest
    container_name: quickbite_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - node-exporter
      - cadvisor
    networks:
      - quickbite_net
## --------------------Grafana-------------------- ##

  grafana:
    image: grafana/grafana:latest
    container_name: quickbite_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - quickbite_net

## --------------------Node-Exporter-------------------- ##

  node-exporter:
    image: prom/node-exporter:latest
    container_name: quickbite_node_exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.rootfs=/host"
    volumes:
      - "/:/host:ro,rslave"
    networks:
      - quickbite_net
## --------------------C-Advisor-------------------- ##
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: quickbite_cadvisor
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - quickbite_net

## --------------------Loki-------------------- ##

  loki:
    image: grafana/loki:latest
    container_name: quickbite_loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    networks:
      - quickbite_net
## --------------------Alloy--------------------##

  alloy:
    image: grafana/alloy:latest
    container_name: quickbite_alloy
    restart: unless-stopped
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "run"
      - "/etc/alloy/config.alloy"
    networks:
      - quickbite_net

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
  loki_data:
networks:
  quickbite_net:
