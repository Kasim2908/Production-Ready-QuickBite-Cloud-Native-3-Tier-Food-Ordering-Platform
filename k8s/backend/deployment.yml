apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: food-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: mohammadkasim/quickbite-backend:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 5001

          env:
            - name: MONGO_URI
              value: mongodb://admin:password123@mongodb:27017

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5