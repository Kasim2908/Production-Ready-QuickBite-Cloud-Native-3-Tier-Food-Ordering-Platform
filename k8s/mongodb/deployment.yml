apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: food-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
        - name: mongodb
          image: mongo:6.0

          ports:
            - containerPort: 27017

          envFrom:
            - secretRef:
                name: database-credentials #mongo-secret

          volumeMounts:
            - name: mongodb-storage
              mountPath: /data/mongodb

      volumes:
        - name: mongodb-storage
          persistentVolumeClaim:
            claimName: mongodb-pvc
