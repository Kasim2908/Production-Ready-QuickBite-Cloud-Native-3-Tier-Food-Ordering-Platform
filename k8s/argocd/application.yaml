apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quickbite
  namespace: argo-cd

spec:
  project: default

  source:
    repoURL: https://github.com/altamashGit/Production-Ready-QuickBite-Cloud-Native-3-Tier-Food-Ordering-Platform.git
    targetRevision: feature/ci-cd
    path: k8s

    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: food-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true 
